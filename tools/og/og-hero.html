<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Fonotext — превью интерактивного демо</title>
<style>
@font-face { font-family: Manrope; src: url('fonts/Manrope.ttf'); font-weight: 200 800; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #0B1220; color: #fff; font-family: Manrope, sans-serif; }
body { width: 100vw; height: 100vh; padding: 42px; display: flex; gap: 38px; align-items: center; overflow: hidden; }
.copy { flex: 1; min-width: 0; }
.brand { font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
.brand img { width: 36px; height: 36px; }
h1 { font-size: 43px; line-height: 1.12; letter-spacing: -.035em; margin: 28px 0 20px; }
p { color: #C9D2E3; font-size: 19px; line-height: 1.5; }
.url { color: #A8B3C7; font-size: 18px; margin-top: 30px; }
.demo { display: block; max-height: 100%; width: 49%; object-fit: contain; }
body.portrait { flex-direction: column; gap: 26px; align-items: stretch; padding: 48px 64px; }
.portrait .copy { flex: none; }
.portrait h1 { font-size: 46px; margin: 22px 0 12px; }
.portrait p { margin: 0; }
.portrait .url { margin-top: 16px; }
.portrait .demo { width: 100%; min-height: 0; flex: 1; object-position: center; }
body.story { padding: 100px 72px; gap: 60px; }
.story h1 { font-size: 64px; }
.story p { font-size: 28px; }
.story .brand { font-size: 40px; }
.story .url { font-size: 26px; }
body.wide { padding: 28px 64px; gap: 70px; }
.wide h1 { font-size: 36px; margin: 16px 0; }
.wide p { font-size: 17px; margin: 0; }
.wide .url { margin-top: 16px; }
.wide .demo { width: 43%; }
</style>
<div class="copy">
  <div class="brand"><img src="../../docs/favicon.svg" alt="">Fonotext</div>
  <h1></h1>
  <p>Интерактивное демо: аудио, таймлайн диалога и расшифровка со спикерами.</p>
  <div class="url">fonotext.ru · Обработка данных в РФ · 152-ФЗ</div>
</div>
<img class="demo" src="../../docs/social/demo-call.png" alt="Карточка разговора с аудиоволной, таймлайном и расшифровкой">
</html>
